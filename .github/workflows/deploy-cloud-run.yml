name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main-app
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: capital-cruise
  PROJECT_NUMBER: "482841496133"
  REGION: us-east4
  SERVICE: capital-cruise-backend-source
  WORKLOAD_IDENTITY_PROVIDER: projects/482841496133/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
  GCP_SERVICE_ACCOUNT: github-cloud-run-deployer@capital-cruise.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: capital-cruise-backend-runner@capital-cruise.iam.gserviceaccount.com

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --source . \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --port 8080 \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
            --set-secrets DATABASE_URL=capital-cruise-database-url:latest,SUPABASE_DB_USERNAME=capital-cruise-supabase-db-username:latest,SUPABASE_DB_PASSWORD=capital-cruise-supabase-db-password:latest,JWT_SECRET=capital-cruise-jwt-secret:latest,JWT_EXPIRATION_MILLIS=capital-cruise-jwt-expiration-millis:latest,CAPITAL_CRUISE_ADMIN_PASSWORD=capital-cruise-admin-password:latest,FRONTEND_ALLOWED_ORIGINS=capital-cruise-frontend-allowed-origins:latest

      - name: Read service URL
        id: url
        run: |
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "Service URL: ${SERVICE_URL}"

      - name: Verify health endpoint
        id: health
        run: |
          curl -fsS "${{ steps.url.outputs.service_url }}/api/v1/health"

      - name: Print logs on health failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          gcloud run services logs read "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 50
