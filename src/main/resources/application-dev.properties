spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:capitalcruise_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:TestSecretKeyForCapitalCruiseJwtMustHaveAtLeastThirtyTwoCharacters}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}
jwt.refresh-expiration-millis=${JWT_REFRESH_EXPIRATION_MILLIS:2592000000}

capital-cruise.seed.admin-enabled=true
capital-cruise.seed.demo-data-enabled=false
capital-cruise.admin.username=${CAPITAL_CRUISE_ADMIN_USERNAME:admin}
capital-cruise.admin.email=${CAPITAL_CRUISE_ADMIN_EMAIL:admin@capitalcruise.local}
capital-cruise.admin.password=${CAPITAL_CRUISE_ADMIN_PASSWORD:CapitalCruiseEnterprise#07}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
