server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.application.name=capital-cruise-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}
jwt.refresh-expiration-millis=${JWT_REFRESH_EXPIRATION_MILLIS:2592000000}

capital-cruise.seed.admin-enabled=${CAPITAL_CRUISE_SEED_ADMIN_ENABLED:false}
capital-cruise.seed.demo-data-enabled=${CAPITAL_CRUISE_SEED_DEMO_DATA_ENABLED:false}
capital-cruise.seed.fail-fast=${CAPITAL_CRUISE_SEED_FAIL_FAST:true}
capital-cruise.admin.username=${CAPITAL_CRUISE_ADMIN_USERNAME:admin}
capital-cruise.admin.email=${CAPITAL_CRUISE_ADMIN_EMAIL:admin@capitalcruise.local}
capital-cruise.admin.password=${CAPITAL_CRUISE_ADMIN_PASSWORD:}
capital-cruise.admin.reset-password=${CAPITAL_CRUISE_ADMIN_RESET_PASSWORD:false}
capital-cruise.openapi.server-url=${OPENAPI_SERVER_URL:}
capital-cruise.public.frontend-url=${FRONTEND_PUBLIC_URL:}
capital-cruise.public.backend-url=${BACKEND_PUBLIC_URL:}

frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
